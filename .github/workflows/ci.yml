name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check src

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://ceca:ceca@localhost:5433/ceca
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: groq
      STT_PROVIDER: whisper_api
      TTS_PROVIDER: elevenlabs
      STORAGE_PROVIDER: local
      MAM_PROVIDER: mock
      VECTOR_PROVIDER: mock
      ANTHROPIC_API_KEY: ci-placeholder
      GROQ_API_KEY: ci-placeholder
      ELEVENLABS_API_KEY: ci-placeholder
      VOYAGE_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
